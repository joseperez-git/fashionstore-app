<div class="row justify-content-center">

  <div class="col-md-4">

    <div class="card shadow">

      <div class="card-body">

        <h3 class="text-center mb-4">
          Iniciar Sesión
        </h3>

        <form>

          <div class="mb-3">

            <label class="form-label">
              Correo
            </label>

            <input
              type="email"
              class="form-control"
              [(ngModel)]="correo"
              name="correo"
            >

          </div>

          <div class="mb-3">

            <label class="form-label">
              Contraseña
            </label>

            <input
              type="password"
              class="form-control"
              [(ngModel)]="password"
              name="password"
            >

          </div>

          <button
            type="button"
            class="btn btn-dark w-100"
            (click)="iniciarSesion()"
          >
            Ingresar
          </button>

        </form>

      </div>

    </div>

  </div>

</div>
