<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="fw-bold">
      Productos
    </h2>

    <div>

      <button
        class="btn me-2"
        [ngClass]="{
          'btn-dark': categoriaSeleccionada === 'Todos',
          'btn-outline-dark': categoriaSeleccionada !== 'Todos'
        }"
        (click)="filtrarCategoria('Todos')"
      >
        Todos
      </button>

      <button
        class="btn me-2"
        [ngClass]="{
          'btn-dark': categoriaSeleccionada === 'Hombre',
          'btn-outline-dark': categoriaSeleccionada !== 'Hombre'
        }"
        (click)="filtrarCategoria('Hombre')"
      >
        Hombre
      </button>

      <button
        class="btn"
        [ngClass]="{
          'btn-dark': categoriaSeleccionada === 'Mujer',
          'btn-outline-dark': categoriaSeleccionada !== 'Mujer'
        }"
        (click)="filtrarCategoria('Mujer')"
      >
        Mujer
      </button>

    </div>

  </div>

  <div class="row">

    <div
      class="col-sm-6 col-md-4 col-lg-3 mb-4"
      *ngFor="let producto of productosFiltrados"
    >

      <div class="card h-100 shadow producto-card">

        <img
          [src]="producto.imagen"
          class="card-img-top imagen-producto"
        >

        <div class="card-body d-flex flex-column">

          <span class="badge bg-secondary mb-2">
            {{ producto.categoria | uppercase }}
          </span>

          <h5 class="fw-bold">
            {{ producto.nombre }}
          </h5>

          <h4 class="text-primary">
            {{ producto.precio | currency:'PEN' }}
          </h4>

          <p
            [ngStyle]="{
              'color':
              producto.stock > 0
              ? 'green'
              : 'red'
            }"
          >
            Stock:
            {{ producto.stock }}
          </p>

          <button class="btn btn-dark mt-auto">
            Agregar al carrito
          </button>

        </div>

      </div>

    </div>

  </div>

</div>
