<div class="container mt-5">

  <div class="text-center mb-4">
    <h2 class="fw-bold">Contáctanos</h2>

    <p class="text-muted">
      Estamos aquí para ayudarte. Envíanos tu mensaje.
    </p>
  </div>

  <div class="row justify-content-center">

    <div class="col-md-8">

      <div class="card shadow-lg border-0 rounded-4">

        <div class="card-body p-4">

          <form #form="ngForm" (ngSubmit)="enviarFormulario(form)">


            <div class="mb-3">

              <label class="form-label fw-semibold">
                Nombre completo
              </label>

              <input
                type="text"
                class="form-control form-control-lg rounded-3"
                placeholder="Ingresa tu nombre"
                [(ngModel)]="nombre"
                name="nombre"
                required
                minlength="3"
                pattern="^[a-zA-ZÀ-ÿ\s]+$"
                #nombreRef="ngModel">

              <div
                *ngIf="nombreRef.invalid && nombreRef.touched"
                class="text-danger mt-1">

                <small *ngIf="nombreRef.errors?.['required']">
                  El nombre es obligatorio
                </small>

                <small *ngIf="nombreRef.errors?.['minlength']">
                  Mínimo 3 caracteres
                </small>

                <small *ngIf="nombreRef.errors?.['pattern']">
                  Solo se permiten letras
                </small>

              </div>

            </div>

            <div class="mb-3">

              <label class="form-label fw-semibold">
                Correo electrónico
              </label>

              <input
                type="email"
                class="form-control form-control-lg rounded-3"
                placeholder="ejemplo@gmail.com"
                [(ngModel)]="correo"
                name="correo"
                required
                email
                #correoRef="ngModel">

              <div
                *ngIf="correoRef.invalid && correoRef.touched"
                class="text-danger mt-1">

                <small *ngIf="correoRef.errors?.['required']">
                  El correo es obligatorio
                </small>

                <small *ngIf="correoRef.errors?.['email']">
                  Correo inválido
                </small>

              </div>

            </div>

            <div class="mb-3">

              <label class="form-label fw-semibold">
                Mensaje
              </label>

              <textarea
                rows="5"
                class="form-control form-control-lg rounded-3"
                placeholder="Escribe tu mensaje aquí..."
                [(ngModel)]="mensaje"
                name="mensaje"
                required
                minlength="10"
                #mensajeRef="ngModel">
              </textarea>

              <div
                *ngIf="mensajeRef.invalid && mensajeRef.touched"
                class="text-danger mt-1">

                <small *ngIf="mensajeRef.errors?.['required']">
                  El mensaje es obligatorio
                </small>

                <small *ngIf="mensajeRef.errors?.['minlength']">
                  Mínimo 10 caracteres
                </small>

              </div>

            </div>

            <div class="d-grid">

              <button
                type="submit"
                class="btn btn-dark btn-lg rounded-3 shadow-sm"
                [disabled]="form.invalid">

                Enviar Mensaje

              </button>

            </div>

          </form>

          <div
            *ngIf="enviado"
            class="alert alert-success text-center mt-3 shadow-sm rounded-3">

            ¡Mensaje enviado correctamente!

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
