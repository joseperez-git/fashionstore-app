<div class="container mt-5">

  <h2 class="text-center mb-4">
    Contáctanos
  </h2>

  <div class="row justify-content-center">

    <div class="col-md-8">

      <div class="card shadow p-4">

        <form (ngSubmit)="enviarFormulario()">

          <div class="mb-3">

            <label class="form-label">
              Nombre
            </label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="nombre"
              name="nombre">

          </div>

          <div class="mb-3">

            <label class="form-label">
              Correo
            </label>

            <input
              type="email"
              class="form-control"
              [(ngModel)]="correo"
              name="correo">

          </div>

          <div class="mb-3">

            <label class="form-label">
              Mensaje
            </label>

            <textarea
              rows="5"
              class="form-control"
              [(ngModel)]="mensaje"
              name="mensaje">

            </textarea>

          </div>

          <button
            type="submit"
            class="btn btn-primary">

            Enviar Mensaje

          </button>

        </form>

        <p class="mt-3">
            Gracias {{ nombre }}
        </p>

      </div>

      <div
        *ngIf="enviado"
        class="alert alert-success mt-3">

        ¡Mensaje enviado correctamente!

      </div>

    </div>

  </div>

</div>
